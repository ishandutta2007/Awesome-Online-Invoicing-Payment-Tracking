<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f8fafc;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        fill: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .metric-value {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #38bdf8;
      }

      /* Subtle CSS Keyframe Animations */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.18) translate(15px, -15px); opacity: 0.55; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseBadge {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }

      .animated-orb1 {
        animation: pulseOrb 8s ease-in-out infinite;
        transform-origin: 1050px 100px;
      }
      .animated-orb2 {
        animation: pulseOrb 10s ease-in-out infinite reverse;
        transform-origin: 150px 320px;
      }
      .animated-card1 {
        animation: floatCard1 5s ease-in-out infinite;
      }
      .animated-card2 {
        animation: floatCard2 6s ease-in-out infinite;
      }
      .animated-status {
        animation: pulseBadge 3s ease-in-out infinite;
      }
      .animated-wire {
        stroke-dasharray: 8 8;
        animation: waveFlow 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGradient)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="animated-orb1" cx="1050" cy="100" r="160" fill="#6366f1" filter="url(#glowFilter)" />
  <circle class="animated-orb2" cx="120" cy="320" r="140" fill="#38bdf8" filter="url(#glowFilter)" />
  <circle cx="650" cy="380" r="120" fill="#a855f7" opacity="0.15" filter="url(#glowFilter)" />

  <!-- Dynamic Connecting Data Flow Wire in Background -->
  <path class="animated-wire" d="M 680 320 C 760 300, 820 220, 890 230 C 960 240, 1000 150, 1080 130" fill="none" stroke="url(#primaryGlow)" stroke-width="2.5" opacity="0.4" />

  <!-- Left Side: Clean Header & Typography (Foreground stays pristine and crisp) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 68)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8" />
      <text x="32" y="21" class="pill-text" fill="#38bdf8">CURATED AWESOME STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="162" class="title-text" font-size="44">Awesome Online Invoicing</text>
    <text x="0" y="212" class="title-text" font-size="40" fill="url(#primaryGlow)">&amp; Payment Tracking</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="258" class="subtitle-text" font-size="16">
      <tspan x="0" dy="0">Top open-source engines and enterprise SaaS solutions for billing automation,</tspan>
      <tspan x="0" dy="24">e-invoicing compliance, real-time payment reconciliation &amp; financial tracking.</tspan>
    </text>

    <!-- Quick Metrics / Features Bar -->
    <g transform="translate(0, 318)">
      <rect width="160" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="metric-title">Self-Hosted</text>
      <text x="16" y="44" class="metric-value">Open Source</text>
    </g>
    <g transform="translate(180, 318)">
      <rect width="160" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="metric-title">Compliance</text>
      <text x="16" y="44" class="metric-value" fill="#10b981">EU E-Invoice</text>
    </g>
    <g transform="translate(360, 318)">
      <rect width="160" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="metric-title">Gateways</text>
      <text x="16" y="44" class="metric-value" fill="#a855f7">Multi-Rail</text>
    </g>
  </g>

  <!-- Right Side: Decorative Interactive Flow Cards (Always behind or beside text, never obscuring) -->
  <g transform="translate(730, 60)">
    <!-- Floating Invoice Card (Card 1) -->
    <g class="animated-card1" filter="url(#shadowFilter)">
      <rect x="30" y="20" width="350" height="175" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      
      <!-- Card Header -->
      <circle cx="60" cy="52" r="14" fill="#3b82f6" fill-opacity="0.2" />
      <path d="M 54 52 L 59 57 L 67 47" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <text x="86" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" fill="#f8fafc">INV-2026-0894</text>
      <text x="86" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Verified &amp; Reconciled</text>
      
      <!-- Paid Status Badge -->
      <g class="animated-status" transform="translate(290, 40)">
        <rect width="70" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#10b981" />
        <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10b981">PAID</text>
      </g>

      <!-- Card Line Items Mockup -->
      <line x1="56" y1="92" x2="354" y2="92" stroke="#1e293b" stroke-width="1.5" />
      <rect x="56" y="110" width="140" height="10" rx="5" fill="#334155" />
      <rect x="56" y="130" width="90" height="8" rx="4" fill="#1e293b" />
      <text x="354" y="122" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="18" fill="#f8fafc">$4,850.00</text>
      <text x="354" y="140" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#10b981">Instant Settlement ⚡</text>
    </g>

    <!-- Floating Payment Reconciliation Card (Card 2) -->
    <g class="animated-card2" filter="url(#shadowFilter)" transform="translate(70, 160)">
      <rect x="0" y="0" width="330" height="140" rx="14" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
      
      <!-- Mini Chart / Activity Wave -->
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Payment Flow Stream</text>
      <circle cx="295" cy="28" r="4" fill="#a855f7" />

      <!-- Graphical waveform of transactions -->
      <path d="M 24 95 Q 60 55, 100 85 T 180 50 T 260 90 T 306 40" fill="none" stroke="url(#accentGlow)" stroke-width="3" stroke-linecap="round" />
      
      <g transform="translate(24, 105)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Active Gateways: Stripe • PayPal • Xendit • SEPA</text>
      </g>
    </g>
  </g>
</svg>
